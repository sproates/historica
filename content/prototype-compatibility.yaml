legacyOverrides:
  - id: maurya
    type: state
    title: Mauryan Empire
    startYear: -321
    endYear: -185
    description: Chandragupta founded a dynasty whose rule spread across much of South Asia.
    point:
      - 85.14
      - 25.61
    url: https://www.metmuseum.org/essays/mauryan-empire-ca-323-185-b-c
    note: Foundation approximately 321 BCE; alternative chronologies vary by a few years. Capital reference, not an imperial boundary.
  - id: pataliputra
    type: city
    title: Pataliputra
    startYear: -400
    endYear: -250
    description: The Mauryan capital near modern Patna. Megasthenes described a large city protected by wooden walls.
    point:
      - 85.14
      - 25.61
    url: https://www.metmuseum.org/essays/mauryan-empire-ca-323-185-b-c
    note: 400–250 BCE is the collection’s study window, not this place’s founding or end. Map points indicate regions, not territorial borders.
  - id: ashoka-rule
    type: period
    title: Ashoka rules the Mauryan Empire
    startYear: -273
    endYear: -232
    description: Imperial rule becomes closely associated with the promotion of Buddhism.
    point:
      - 85.14
      - 25.61
    url: https://www.metmuseum.org/essays/mauryan-empire-ca-323-185-b-c
    note: Approximate reign, using the Met chronology; accession and coronation dates differ between accounts.
