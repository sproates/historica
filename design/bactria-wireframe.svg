<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
<title id="title">Timeline Bactria screen proposal</title><desc id="desc">Static layout sketch showing a map area, historical comparison control, event details and timeline. All map shapes are schematic and are not geographical evidence.</desc>
<defs><pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M 55 0 L 0 0 0 55" fill="none" stroke="#d9dfd9" stroke-width="1"/></pattern><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#c7aa69" opacity=".25"/></pattern></defs>
