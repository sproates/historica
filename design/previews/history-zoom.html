<div id="history-zoom">
<style>
#history-zoom{--paper:light-dark(#f6f3eb,#252720);--ink:light-dark(#293b32,#ecebe2);--muted:light-dark(#626b60,#b6bfb0);--line:light-dark(#d5d9cd,#50594c);--surface:light-dark(#fffefa,#30352c);--green:light-dark(#355c49,#acd0b4);--wash:light-dark(#e3eadd,#3a4937);background:var(--paper);color:var(--ink);padding:24px;font:15px/1.5 system-ui,sans-serif;border-radius:12px}
#history-zoom *{box-sizing:border-box}#history-zoom button,#history-zoom select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:9px 12px;background:var(--surface);color:var(--ink)}
#history-zoom button{cursor:pointer}#history-zoom button:disabled{opacity:.45;cursor:default}#history-zoom button[aria-pressed=true]{background:var(--green);color:var(--paper)}
#history-zoom header,#history-zoom .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}#history-zoom header{padding-bottom:18px;border-bottom:1px solid var(--line)}
#history-zoom .brand{letter-spacing:.17em;font-weight:600}#history-zoom small,#history-zoom .quiet{color:var(--muted)}#history-zoom small{font-size:12px}
#history-zoom h2{font:500 33px/1.2 Georgia,serif;margin:8px 0}#history-zoom h3{font:500 22px/1.3 Georgia,serif;margin:0}#history-zoom p{margin:8px 0 14px}
#history-zoom .controls{display:flex;gap:6px;flex-wrap:wrap}#history-zoom .period{padding:22px 0 16px}#history-zoom .axis{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--muted)}
#history-zoom .track{height:38px;background:var(--wash);position:relative;border-radius:5px;margin:8px 0 12px;overflow:hidden}#history-zoom .window{position:absolute;top:0;bottom:0;background:var(--green)}
#history-zoom .moment{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink)}#history-zoom .context{padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#history-zoom .content{margin-top:22px;display:grid;grid-template-columns:165px 1fr;gap:24px}#history-zoom nav{display:flex;flex-direction:column;gap:7px}#history-zoom nav button{text-align:left}
#history-zoom article{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:7px;margin-top:12px}#history-zoom .extent{position:relative;height:6px;background:var(--wash);margin:14px 0}#history-zoom .extent span{position:absolute;height:100%;background:var(--green)}
#history-zoom .footer{margin-top:20px;font-size:12px;color:var(--muted)}#history-zoom a{color:var(--green)}#history-zoom input{accent-color:var(--green);width:100%}#history-zoom .crumbs{margin-top:15px;color:var(--muted);font-size:12px}
@media(max-width:600px){#history-zoom{padding:15px}#history-zoom .content{grid-template-columns:1fr;gap:14px}#history-zoom nav{flex-direction:row;flex-wrap:wrap}#history-zoom h2{font-size:27px}}
</style>
<header><span class="brand">TIMELINE</span><small>History, alongside history · interactive concept</small></header>
<div class="crumbs" id="hz-crumbs"></div>
<section class="period">
 <div class="row"><div><small id="hz-scale"></small><h2 id="hz-title"></h2></div><div class="controls"><button id="hz-out">− Zoom out</button><button id="hz-in">+ Zoom in</button></div></div>
 <div class="row"><span class="quiet" id="hz-range"></span><div class="controls"><button id="hz-all">All history</button><button id="hz-fit">Fit Alexander’s story</button></div></div>
 <div class="axis"><span id="hz-left"></span><span id="hz-right"></span></div>
 <div class="track" role="img" aria-label="Proportional time scale with the next zoom window highlighted"><div class="window" id="hz-window"></div><div class="moment" id="hz-marker"></div></div>
 <div class="row"><small id="hz-legend"></small><button id="hz-drill"></button></div>
</section>
<div class="context"><div class="row"><span id="hz-pin"></span><small id="hz-pin-note"></small></div><div id="hz-scrub"><input id="hz-year" type="range" min="-336" max="-323" value="-329" aria-label="Selected year within Alexander’s story"></div></div>
<section class="content"><nav aria-label="Regions"><button data-region="all" aria-pressed="true">Around the world</button><button data-region="africa">Africa</button><button data-region="campaign">Alexander’s world</button><button data-region="china">East Asia</button><button data-region="italy">Italy</button><button data-region="americas">The Americas</button></nav><div><div class="row"><h3 id="hz-region-title">Around the world</h3><small id="hz-count"></small></div><div id="hz-cards" aria-live="polite"></div></div></section>
<div class="footer">Concept coverage, not a complete collection. Deep-time dates are approximate. “All history” here starts with Homo sapiens; earlier human relatives would extend it further. <a href="https://humanorigins.si.edu/evidence/human-fossils/species/homo-sapiens" target="_blank" rel="noreferrer">Origins source</a> · <a href="https://humanorigins.si.edu/human-characteristics/humans-change-world" target="_blank" rel="noreferrer">Food production source</a></div>
</div>
<script>
(()=>{
 const root=document.getElementById('history-zoom'),q=s=>root.querySelector(s);
 const levels=[
 {title:'The human story',scale:'ALL HISTORY',start:-300000,end:2026,range:'About 300,000 BCE – today',next:'Explore the last 12,000 years',crumb:'All history'},
 {title:'The last 12,000 years',scale:'MILLENNIA',start:-10000,end:2026,range:'About 10,000 BCE – today',next:'Explore 1000 BCE – 500 CE',crumb:'Last 12,000 years'},
 {title:'A world of ancient societies',scale:'BROAD PERIOD',start:-1000,end:500,range:'1000 BCE – 500 CE',next:'Explore the fourth century BCE',crumb:'1000 BCE – 500 CE'},
 {title:'The fourth century BCE',scale:'CENTURY',start:-400,end:-301,range:'400–301 BCE',next:'Explore Alexander’s whole story',crumb:'Fourth century BCE'},
 {title:'Alexander’s whole story',scale:'CAMPAIGN',start:-336,end:-323,range:'336–323 BCE',next:'Explore the selected year',crumb:'Alexander'},
 {title:'One moment, many places',scale:'YEAR',start:-329,end:-329,range:'329 BCE',next:'',crumb:'Selected year'}
 ];
 const stories=[
 {region:'campaign',area:'Alexander’s world',title:'Alexander’s campaign',start:-336,end:-323,text:'Main stages from Macedonia to Babylon.',dates:'336–323 BCE',target:4},
 {region:'china',area:'East Asia',title:'China’s competing states',start:-403,end:-221,text:'Rival states within the Zhou world. A broad period, not a single event.',dates:'403–221 BCE · broad period',target:3},
 {region:'italy',area:'Italy',title:'Rome after the Latin War',start:-338,end:-327,text:'The settlement after the Latin War provides the context for this part of Italy.',dates:'Context shown for 338–327 BCE',target:4},
 {region:'italy',area:'Italy',title:'The Second Samnite War',start:-326,end:-304,text:'Rome and the Samnites are at war.',dates:'326–304 BCE',target:3},
 {region:'americas',area:'The Americas',title:'Early Monte Albán',start:-500,end:-100,text:'An archaeological phase in the history of the city in Oaxaca.',dates:'About 500–100 BCE',target:3}
 ];
 let state={level:0,region:'all',year:-329};
 function restore(s){const v=s?.modelContent;if(v&&Number.isInteger(v.level)&&v.level>=0&&v.level<6&&['all','africa','campaign','china','italy','americas'].includes(v.region)&&Number.isInteger(v.year)&&v.year>=-336&&v.year<=-323)state={level:v.level,region:v.region,year:v.year};}
 restore(window.openai?.widgetState);
 const date=n=>`${Math.abs(n).toLocaleString('en-GB')} ${n<0?'BCE':'CE'}`;
 function save(){window.openai?.setWidgetState?.({modelContent:state,privateContent:null})?.catch(()=>{});}
 function render(){
 const lv=state.level,l={...levels[lv]};if(lv===5){l.start=state.year;l.end=state.year;l.range=date(state.year);}
 q('#hz-crumbs').textContent=levels.slice(0,lv+1).map(x=>x.crumb).join(' › ');
 q('#hz-title').textContent=l.title;q('#hz-scale').textContent=l.scale;q('#hz-range').textContent=l.range;
 q('#hz-left').textContent=date(l.start);q('#hz-right').textContent=lv===5?'':date(l.end);
 q('#hz-out').disabled=lv===0;q('#hz-in').disabled=lv===5;
 const next=levels[Math.min(5,lv+1)],span=l.end-l.start+1;
 const ns=lv===4?state.year:next.start,ne=lv===4?state.year:next.end;
 q('#hz-window').style.left=`${Math.max(0,100*(ns-l.start)/span)}%`;q('#hz-window').style.width=`${Math.min(100,100*(ne-ns+1)/span)}%`;
 q('#hz-marker').style.left=`${100*(state.year-l.start)/span}%`;
 q('#hz-drill').hidden=lv===5;q('#hz-drill').textContent=l.next;
 q('#hz-legend').textContent=lv===5?'One year in view':`Shaded span: next zoom · ${lv===0?'the last 12,000 years occupy about 4% of this view':'time remains proportional'}`;
 q('#hz-pin').textContent=`PINNED MOMENT · ${date(state.year)}`;
 q('#hz-pin-note').textContent=state.year===-329?'Alexander in Bactria · about 26–27 years old':'Alexander’s campaign · year selected';
 q('#hz-scrub').hidden=lv!==4;q('#hz-year').value=state.year;
 root.querySelectorAll('[data-region]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.region===state.region));
 q('#hz-region-title').textContent=root.querySelector(`[data-region="${state.region}"]`).textContent;
 let entries=stories.filter(r=>r.start<=l.end&&r.end>=l.start&&(state.region==='all'||r.region===state.region));
 let html='';
 if(lv===0&&(state.region==='all'||state.region==='africa'))html+=`<article><small>Africa · deep time</small><h3>The origins of our species</h3><p>Homo sapiens emerged in Africa about 300,000 years ago.</p><button data-jump="1">Move closer in time →</button></article>`;
 if(lv<=1&&state.region==='all')html+=`<article><small>Across regions · roughly the past 12,000 years</small><h3>Food production and changing societies</h3><p>Different societies follow different paths; there is no single worldwide start date.</p><button data-jump="2">Explore a later period →</button></article>`;
 if(lv<=1){if(entries.length)html+=`<article><small>Sample collection · near 329 BCE</small><h3>Alexander and his contemporaries</h3><p>${entries.map(r=>r.area).filter((v,i,a)=>a.indexOf(v)===i).join(' · ')}</p><button data-jump="3">Zoom into these stories →</button></article>`;}
 else html+=entries.map(r=>{const left=100*(Math.max(l.start,r.start)-l.start)/span,width=100*(Math.min(l.end,r.end)-Math.max(l.start,r.start)+1)/span;return `<article><small>${r.area} · ${r.dates}</small><h3>${r.region==='campaign'&&lv===5&&state.year===-329?'Alexander enters Bactria':r.title}</h3><p>${r.text}</p><div class="extent" role="img" aria-label="Story overlap with the visible period"><span style="left:${left}%;width:${width}%"></span></div>${lv<5?`<button data-jump="${Math.max(lv+1,r.target)}">Explore more closely →</button>`:'<small>At the selected moment · period context may extend beyond this year</small>'}</article>`;}).join('');
 q('#hz-cards').innerHTML=html||'<article><h3>A gap in our sample</h3><p>No stories have been added for this region at this scale yet.</p><button data-reset>Browse all regions</button></article>';
 q('#hz-count').textContent=lv<=1?'Broad overview · selected stories':`${entries.length} overlapping stories`;
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='hz-out')state.level=Math.max(0,state.level-1);if(b.id==='hz-in'||b.id==='hz-drill')state.level=Math.min(5,state.level+1);if(b.id==='hz-all')state.level=0;if(b.id==='hz-fit')state.level=4;if(b.dataset.region)state.region=b.dataset.region;if(b.dataset.jump)state.level=Number(b.dataset.jump);if(b.hasAttribute('data-reset'))state.region='all';render();save();});
 q('#hz-year').addEventListener('input',e=>{state.year=Number(e.target.value);render();});q('#hz-year').addEventListener('change',save);
 window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);render();});render();
})();
</script>
