name: Verify Historica
on:
  pull_request: {}
  push:
    branches:
      - main
      - feature/github-pages-preparation
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Classify changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/change-scope.ts "$BASE" HEAD
      - name: Check patch formatting
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" HEAD
          else
            git diff --check HEAD
          fi
      - name: Reuse the successful PR package for the identical source tree
        id: reuse
        if: steps.changes.outputs.scope != 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICA_ANALYTICS_TOKEN: ${{ vars.HISTORICA_ANALYTICS_TOKEN }}
          TREE: ${{ steps.changes.outputs.tree }}
        run: node scripts/restore-verified.ts tree "$TREE"
      - name: Restore the verified baseline for sharing artwork
        id: baseline
        if: steps.changes.outputs.scope == 'sharing' && steps.reuse.outputs.restored != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICA_ANALYTICS_TOKEN: ${{ vars.HISTORICA_ANALYTICS_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/restore-verified.ts base "$BASE"
      - name: Choose proportionate verification
        id: plan
        env:
          SCOPE: ${{ steps.changes.outputs.scope }}
          REUSED: ${{ steps.reuse.outputs.restored }}
          BASELINE: ${{ steps.baseline.outputs.restored }}
        run: |-
          if [ "$SCOPE" = docs ]; then MODE=docs
          elif [ "$REUSED" = true ]; then MODE=reuse
          elif [ "$SCOPE" = sharing ] && [ "$BASELINE" = true ]; then MODE=sharing
          else MODE=full
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Verification: $MODE" >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked build tools
        if: steps.plan.outputs.mode == 'full'
        run: npm ci
      - name: Restore verified static pages
        if: steps.plan.outputs.mode == 'full'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: release/static-incremental/
          key: ${{ runner.os }}-historica-static-v1-${{ github.sha }}
          restore-keys: ${{ runner.os }}-historica-static-v1-
      - name: Generate and verify the site
        if: steps.plan.outputs.mode == 'full'
        run: npm test
      - name: Prepare production release
        if: steps.plan.outputs.mode == 'full'
        env:
          HISTORICA_ANALYTICS_TOKEN: ${{ vars.HISTORICA_ANALYTICS_TOKEN }}
        run: |
          test -n "$HISTORICA_ANALYTICS_TOKEN"
          node scripts/build-pages.ts --static-source release/static-incremental --production --base / --output release/production-site
          node scripts/verify-pages.ts release/production-site
      - name: Update and verify sharing artwork only
        if: steps.plan.outputs.mode == 'sharing'
        run: node scripts/update-sharing-package.ts
      - name: Bundle the verified PR output
        if: steps.plan.outputs.mode != 'docs' && github.event_name == 'pull_request'
        run: |
          mkdir -p release/verified-pr
          mv release/production-site release/verified-pr/production-site
          if [ -d release/static-incremental ]; then
            mv release/static-incremental release/verified-pr/static-incremental
          fi
      - name: Keep the verified PR package and incremental page cache
        if: steps.plan.outputs.mode != 'docs' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historica-verified-${{ steps.changes.outputs.tree }}
          path: release/verified-pr/
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
      - name: Retain production release for deployment and recovery
        if: steps.plan.outputs.mode != 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historica-production-${{ github.sha }}
          path: release/production-site/
          include-hidden-files: true
          retention-days: 90
          compression-level: 1
      - name: Save verified main-branch static pages
        if: success() && steps.plan.outputs.mode != 'docs' && github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('release/static-incremental/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: release/static-incremental/
          key: ${{ runner.os }}-historica-static-v1-${{ github.sha }}
      - name: Prepare staging only when staging was requested
        if: steps.plan.outputs.mode != 'docs' && github.ref == 'refs/heads/feature/github-pages-preparation'
        run: |-
          node scripts/build-pages.ts --static-source release/static-incremental
          node scripts/verify-pages.ts
      - name: Keep the verified staging artifact
        if: steps.plan.outputs.mode != 'docs' && github.ref == 'refs/heads/feature/github-pages-preparation'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historica-pages-${{ github.sha }}
          path: release/pages-site/
          include-hidden-files: true
          retention-days: 7
          compression-level: 1
      - name: Package staging for Pages
        if: steps.plan.outputs.mode != 'docs' && github.ref == 'refs/heads/feature/github-pages-preparation'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: release/pages-site/
          retention-days: 7
      - name: Report scope
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: |-
          case "$MODE" in
           docs) echo 'Internal documentation only. No site build or app tests.' ;;
           reuse) echo 'Reused the verified PR package. No dependency install, rebuild or repeated app tests.' ;;
           sharing) echo 'Verified sharing images and metadata against the retained baseline. No dependency install, app build or app tests.' ;;
           full) echo 'Built and verified changes that need application checks.' ;;
          esac >> "$GITHUB_STEP_SUMMARY"
  staging:
    if: needs.verify.outputs.scope == 'site' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/feature/github-pages-preparation'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-staging
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Refuse to deploy if the production domain is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sproates/historica/pages > "$RUNNER_TEMP/pages.json"
          node -e 'const p=require(process.env.RUNNER_TEMP+"/pages.json"); if(p.cname || p.html_url!=="https://sproates.github.io/historica/") process.exit(1);'
      - name: Deploy verified staging artifact
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
